name: Temporary Phase 3 Composer lock update

on:
  push:
    branches:
      - refactor/migrate-github-implementation
    paths:
      - .github/workflows/update-phase3-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    if: ${{ github.ref == 'refs/heads/refactor/migrate-github-implementation' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/migrate-github-implementation
          fetch-depth: 0

      - name: Verify exact branch revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/refactor/migrate-github-implementation)"

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none

      - name: Update only newly declared dependency roots
        run: |
          set -euo pipefail
          composer update ran/wp-release-updater phpunit/phpunit --with-all-dependencies --no-interaction --prefer-dist --no-audit
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-audit
          if grep -F '"name": "ran/booster"' composer.lock; then
            echo 'composer.lock must not acquire a production dependency on ran/booster' >&2
            exit 1
          fi
          git diff --check -- composer.lock
          git diff --stat -- composer.lock

      - name: Commit lockfile and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git rm .github/workflows/update-phase3-lock.yml
          git diff --cached --check
          git commit -m 'build: lock Phase 3 provider dependencies'
          git push origin HEAD:refactor/migrate-github-implementation
