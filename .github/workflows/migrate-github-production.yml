name: Temporary GitHub production migration

on:
  push:
    branches:
      - refactor/migrate-github-implementation
    paths:
      - .github/workflows/migrate-github-production.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/refactor/migrate-github-implementation' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out provider branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/migrate-github-implementation
          fetch-depth: 0

      - name: Check out exact Booster source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          ref: 52305d0f394c4b6447015da206ddc0f622ff39e8
          persist-credentials: false
          path: .source/booster

      - name: Verify exact revisions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/refactor/migrate-github-implementation)"
          test "$(git -C .source/booster rev-parse HEAD)" = 52305d0f394c4b6447015da206ddc0f622ff39e8

      - name: Copy and mechanically transform production source
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          source_root = Path('.source/booster/RAN/Booster/GitHub')
          target_root = Path('src')
          old = b'RAN\\Booster\\GitHub'
          new = b'RAN\\BoosterGitHubProvider\\V1'
          files = [
              'CredentialPolicy.php',
              'Diagnostics.php',
              'GitHubProvider.php',
              'GitHubReleaseArtifact.php',
              'GitHubReleaseNativeTarget.php',
              'RepositoryBrowser.php',
              'RepositoryWebhookClient.php',
              'WebhookNormalizer.php',
              'WebhookPolicy.php',
              'ReleaseDeployments/WorkflowAssistance/GitHubRepositoryClient.php',
              'ReleaseDeployments/WorkflowAssistance/GitHubRepositoryReleaseWorkflow.php',
              'ReleaseDeployments/WorkflowAssistance/ManagedReleaseBundle.php',
              'ReleaseDeployments/WorkflowAssistance/RepositorySnapshot.php',
              'ReleaseDeployments/WorkflowAssistance/SetupRecordStore.php',
              'ReleaseDeployments/WorkflowAssistance/SourceReadyAssessment.php',
              'ReleaseDeployments/WorkflowAssistance/SourceReadyAssessor.php',
              'ReleaseDeployments/WorkflowAssistance/TemplatePack.php',
              'ReleaseDeployments/WorkflowAssistance/TemplatePackRepositoryClient.php',
              'ReleaseDeployments/WorkflowAssistance/WorkflowApplicationCoordinator.php',
          ]

          total_replacements = 0
          for relative in files:
              source = source_root / relative
              target = target_root / relative
              if not source.is_file():
                  raise SystemExit(f'missing source file: {source}')
              raw = source.read_bytes()
              count = raw.count(old)
              if count < 1:
                  raise SystemExit(f'namespace marker missing from {source}: {count}')
              transformed = raw.replace(old, new)
              total_replacements += count
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(transformed)
              if target.read_bytes() != raw.replace(old, new):
                  raise SystemExit(f'mechanical equivalence failed: {relative}')

          gitkeep = target_root / '.gitkeep'
          if gitkeep.exists():
              gitkeep.unlink()

          actual = sorted(str(path.relative_to(target_root)) for path in target_root.rglob('*.php'))
          expected = sorted(files)
          if actual != expected:
              raise SystemExit(f'target manifest mismatch\nexpected={expected}\nactual={actual}')

          private_prefixes = (
              b'RAN\\Admin\\',
              b'RAN\\Internal\\',
              b'RAN\\Logging\\',
              b'RAN\\Secrets\\',
              b'RAN\\Storage\\',
              b'RAN\\WordPress\\',
          )
          for relative in files:
              data = (target_root / relative).read_bytes()
              if old in data:
                  raise SystemExit(f'old GitHub namespace remains: {relative}')
              for prefix in private_prefixes:
                  if prefix in data:
                      raise SystemExit(f'private Booster implementation dependency {prefix!r} in {relative}')

          store = (target_root / 'ReleaseDeployments/WorkflowAssistance/SetupRecordStore.php').read_bytes()
          for option_name in (
              b'ran_booster_github_release_workflow_setup_records_v1',
              b'ran_booster_github_release_workflow_setup_records_v1_lock',
          ):
              if option_name not in store:
                  raise SystemExit(f'missing stored-option compatibility marker: {option_name!r}')

          print(f'migrated_files={len(files)}')
          print(f'namespace_replacements={total_replacements}')
          PY

      - name: Verify staged production tree
        run: |
          set -euo pipefail
          test -z "$(grep -R -l -F 'RAN\Booster\GitHub' src --include='*.php' || true)"
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          git diff --check
          git diff --stat -- src

      - name: Commit migrated production source and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm .github/workflows/migrate-github-production.yml
          git diff --cached --check
          git commit -m 'refactor: migrate GitHub provider production source'
          git push origin HEAD:refactor/migrate-github-implementation
