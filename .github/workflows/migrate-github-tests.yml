name: Temporary GitHub test migration

on:
  push:
    branches:
      - refactor/migrate-github-implementation
    paths:
      - .github/workflows/migrate-github-tests.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/refactor/migrate-github-implementation' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out provider branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/migrate-github-implementation
          fetch-depth: 0

      - name: Check out exact Booster source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          ref: 52305d0f394c4b6447015da206ddc0f622ff39e8
          persist-credentials: false
          path: .source/booster

      - name: Verify exact revisions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/refactor/migrate-github-implementation)"
          test "$(git -C .source/booster rev-parse HEAD)" = 52305d0f394c4b6447015da206ddc0f622ff39e8

      - name: Copy and mechanically transform provider-owned tests
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          source_root = Path('.source/booster/tests/Booster/GitHub')
          target_root = Path('tests/Booster/GitHub')
          old = b'RAN\\Booster\\GitHub'
          new = b'RAN\\BoosterGitHubProvider\\V1'
          excluded = {
              'WebhookManagement/GitHubLegacyAssistedHooksRetirementTest.php',
              'WebhookManagement/GitHubProviderLegacyWordPressFunctions.php',
          }
          architectural = {
              'bootstrap.php',
              'ModuleDependencyBoundaryTest.php',
              'ReleaseDeployments/WorkflowAssistance/WorkflowAssistanceTestBootstrap.php',
          }

          all_files = sorted(str(path.relative_to(source_root)) for path in source_root.rglob('*.php'))
          if len(all_files) != 43:
              raise SystemExit(f'unexpected exact-source GitHub test count: {len(all_files)}')
          if not excluded.issubset(all_files):
              raise SystemExit(f'expected Booster-owned presentation exclusions missing: {sorted(excluded - set(all_files))}')
          files = [relative for relative in all_files if relative not in excluded]
          if len(files) != 41:
              raise SystemExit(f'unexpected provider-owned GitHub test count: {len(files)}')

          for relative in files:
              source = source_root / relative
              target = target_root / relative
              raw = source.read_bytes()
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw.replace(old, new))
              if relative not in architectural and target.read_bytes() != raw.replace(old, new):
                  raise SystemExit(f'mechanical equivalence failed: {relative}')

          bootstrap = target_root / 'bootstrap.php'
          text = bootstrap.read_text()
          substitutions = [
              (
                  '$ranBoosterRoot = dirname( __DIR__, 3 );',
                  "$ranProviderRoot = dirname( __DIR__, 3 );\n$ranBoosterRoot  = getenv( 'RAN_BOOSTER_CORE_PATH' );\nif ( ! is_string( $ranBoosterRoot ) || '' === trim( $ranBoosterRoot ) ) {\n\tthrow new LogicException( 'RAN_BOOSTER_CORE_PATH must identify the certified Booster host for the extracted GitHub suite.' );\n}\n$ranBoosterRoot = rtrim( $ranBoosterRoot, '/\\\\' );",
              ),
              (
                  'static function ( string $class ) use ( $ranBoosterRoot ): void {',
                  'static function ( string $class ) use ( $ranProviderRoot, $ranBoosterRoot ): void {',
              ),
              (
                  "$ranBoosterRoot . '/RAN/Booster/GitHub/'",
                  "$ranProviderRoot . '/src/'",
              ),
              (
                  "$ranBoosterRoot . '/vendor/ran/updater-support/src/'",
                  "$ranProviderRoot . '/vendor/ran/updater-support/src/'",
              ),
          ]
          for before, after in substitutions:
              if text.count(before) != 1:
                  raise SystemExit(f'root bootstrap rewrite marker mismatch: {before}')
              text = text.replace(before, after)
          bootstrap.write_text(text)

          boundary = target_root / 'ModuleDependencyBoundaryTest.php'
          text = boundary.read_text()
          before = "$module        = dirname( __DIR__, 3 ) . '/RAN/Booster/GitHub';"
          after = "$module        = dirname( __DIR__, 3 ) . '/src';"
          if text.count(before) != 1:
              raise SystemExit('module boundary path marker mismatch')
          boundary.write_text(text.replace(before, after))

          workflow_bootstrap = target_root / 'ReleaseDeployments/WorkflowAssistance/WorkflowAssistanceTestBootstrap.php'
          text = workflow_bootstrap.read_text()
          before = '$ranBoosterRoot = dirname( __DIR__, 5 );'
          after = "$ranBoosterRoot = getenv( 'RAN_BOOSTER_CORE_PATH' );\nif ( ! is_string( $ranBoosterRoot ) || '' === trim( $ranBoosterRoot ) ) {\n\tthrow new \\LogicException( 'RAN_BOOSTER_CORE_PATH must identify the certified Booster host for workflow-assistance tests.' );\n}\n$ranBoosterRoot = rtrim( $ranBoosterRoot, '/\\\\' );"
          if text.count(before) != 1:
              raise SystemExit('workflow bootstrap host-root marker mismatch')
          workflow_bootstrap.write_text(text.replace(before, after))

          final = sorted(str(path.relative_to(target_root)) for path in target_root.rglob('*.php'))
          if final != files:
              raise SystemExit(f'target manifest mismatch\nexpected={files}\nactual={final}')
          if (target_root / 'WebhookManagement').exists():
              raise SystemExit('Booster-owned legacy WebhookManagement presentation tests must not migrate')
          for relative in files:
              if old in (target_root / relative).read_bytes():
                  raise SystemExit(f'old production namespace remains: {relative}')

          print(f'migrated_test_files={len(files)}')
          print(f'mechanical_files={len(files) - len(architectural)}')
          print(f'architectural_harness_edits={len(architectural)}')
          PY

      - name: Verify staged test tree
        run: |
          set -euo pipefail
          test ! -e tests/Booster/GitHub/WebhookManagement
          test -z "$(grep -R -l -F 'RAN\Booster\GitHub' tests/Booster/GitHub --include='*.php' || true)"
          find tests/Booster/GitHub -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          git diff --check
          git diff --stat -- tests/Booster/GitHub

      - name: Commit migrated tests and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/Booster/GitHub
          git rm .github/workflows/migrate-github-tests.yml
          git diff --cached --check
          git commit -m 'test: migrate GitHub provider implementation suite'
          git push origin HEAD:refactor/migrate-github-implementation
