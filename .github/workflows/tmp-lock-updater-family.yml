name: Temporary updater-family foundation normalization

on:
  push:
    branches:
      - chore/package-foundation
    paths:
      - .github/workflows/tmp-lock-updater-family.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/package-foundation
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2
      - name: Regenerate locked package toolchain
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Normalize PHP with PHPCBF
        shell: bash
        run: |
          set +e
          composer format
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Verify canonical package contract
        run: composer check
      - name: Check out exact Booster host
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          ref: 891ef2b33d1d50ef03e2c9f6ad170b19ac68b081
          persist-credentials: false
          path: booster-host
      - name: Verify exact Booster host contract
        env:
          RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/booster-host
        run: php tests/host-contract.php
      - name: Commit normalized lock and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-lock-updater-family.yml
          git add composer.lock tests
          git commit -m "chore: lock updater-family quality toolchain"
          git push origin HEAD:chore/package-foundation
