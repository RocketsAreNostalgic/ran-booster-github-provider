name: Temporary normalize revised package foundation

on:
  push:
    branches:
      - chore/package-foundation
    paths:
      - .github/workflows/tmp-normalize-foundation.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/package-foundation
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Regenerate locked quality toolchain
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Normalize PHP with repository tools
        shell: bash
        run: |
          set -euo pipefail
          composer cs
          set +e
          composer standards:fix
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi

      - name: Verify canonical package quality contract
        run: composer check

      - name: Verify exact Booster host contract
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/RocketsAreNostalgic/ran-booster.git ../booster-host
          git -C ../booster-host fetch --depth=1 origin 891ef2b33d1d50ef03e2c9f6ad170b19ac68b081
          git -C ../booster-host checkout --detach FETCH_HEAD
          test "$(git -C ../booster-host rev-parse HEAD)" = '891ef2b33d1d50ef03e2c9f6ad170b19ac68b081'
          RAN_BOOSTER_CORE_PATH="$(cd ../booster-host && pwd)" php tests/host-contract.php

      - name: Commit normalized foundation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-normalize-foundation.yml
          git add -A
          git commit -m "chore: normalize RAN quality foundation"
          git push origin HEAD:chore/package-foundation
