name: Template compatibility diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.head_ref == 'fix/28-template-pack-compatibility'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact diagnostic revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Report exact PHPCS findings
        run: vendor/bin/phpcs --standard=.phpcs.xml --report=full tests/Booster/GitHub/ReleaseDeployments/WorkflowAssistance/TemplatePackTransitionTest.php
