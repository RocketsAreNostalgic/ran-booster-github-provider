name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@788f783d2998994f7aab9691710911ed1bd762c9
    with:
      php-floor: '8.2'
      php-current: '8.5'
      php-extensions: zip
      node-version: '24.11.0'

  host-contract:
    name: Booster host contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact package revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: provider
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Check out certified Booster host
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          ref: 891ef2b33d1d50ef03e2c9f6ad170b19ac68b081
          persist-credentials: false
          path: booster
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - name: Verify current host boundary
        env:
          RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/booster
        working-directory: provider
        run: php tests/host-contract.php

  quality:
    if: ${{ always() }}
    needs: [baseline, host-contract]
    runs-on: ubuntu-24.04
    steps:
      - name: Require normalized package foundation
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          HOST_CONTRACT_RESULT: ${{ needs.host-contract.result }}
        run: |
          set -euo pipefail
          test "$BASELINE_RESULT" = success
          test "$HOST_CONTRACT_RESULT" = success
