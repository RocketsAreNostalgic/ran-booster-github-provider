name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@788f783d2998994f7aab9691710911ed1bd762c9 # reviewed PHP quality v2 provider
    with:
      php-floor: '8.2'
      php-current: '8.5'
      php-extensions: zip
      node-version: '24.11.0'

  release-classification:
    name: Release classification
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"

      - name: Set up Node for release classification
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          check-latest: false

      - name: Require release-driving squash title for release-significant changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          RAN_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RAN_RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RAN_RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release-classification.mjs

  host-contract:
    name: Booster host contract
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out exact package revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: provider
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check out certified Booster host
        # Phase 3 parity is certified against the exact Booster source from which this implementation was extracted.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          ref: 52305d0f394c4b6447015da206ddc0f622ff39e8
          persist-credentials: false
          path: booster

      - name: Verify exact source and host revisions
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RAN_BOOSTER_HOST_SHA: 52305d0f394c4b6447015da206ddc0f622ff39e8
        run: |
          set -euo pipefail
          test -n "$RAN_EXPECTED_SHA"
          test "$(git -C provider rev-parse HEAD)" = "$RAN_EXPECTED_SHA"
          test "$(git -C booster rev-parse HEAD)" = "$RAN_BOOSTER_HOST_SHA"

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify current host boundary
        env:
          RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/booster
        working-directory: provider
        run: php tests/host-contract.php

  implementation:
    name: Implementation PHP ${{ matrix.php }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Check out exact package revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: provider
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check out certified Booster host
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          ref: 52305d0f394c4b6447015da206ddc0f622ff39e8
          persist-credentials: false
          path: booster

      - name: Verify exact source and host revisions
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RAN_BOOSTER_HOST_SHA: 52305d0f394c4b6447015da206ddc0f622ff39e8
        run: |
          set -euo pipefail
          test -n "$RAN_EXPECTED_SHA"
          test "$(git -C provider rev-parse HEAD)" = "$RAN_EXPECTED_SHA"
          test "$(git -C booster rev-parse HEAD)" = "$RAN_BOOSTER_HOST_SHA"

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      - name: Install provider dependencies
        working-directory: provider
        run: composer install --no-interaction --prefer-dist

      - name: Analyze migrated production source
        env:
          RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/booster
        working-directory: provider
        run: composer analyze

      - name: Run migrated implementation suite
        env:
          RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/booster
        working-directory: provider
        run: composer test:implementation

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - baseline
      - release-classification
      - host-contract
      - implementation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require all quality lanes
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          CLASSIFICATION_RESULT: ${{ needs.release-classification.result }}
          HOST_CONTRACT_RESULT: ${{ needs.host-contract.result }}
          IMPLEMENTATION_RESULT: ${{ needs.implementation.result }}
        run: |
          printf 'baseline=%s\nclassification=%s\nhost-contract=%s\nimplementation=%s\n' "$BASELINE_RESULT" "$CLASSIFICATION_RESULT" "$HOST_CONTRACT_RESULT" "$IMPLEMENTATION_RESULT"
          test "$BASELINE_RESULT" = success
          test "$CLASSIFICATION_RESULT" = success
          test "$HOST_CONTRACT_RESULT" = success
          test "$IMPLEMENTATION_RESULT" = success
