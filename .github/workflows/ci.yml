name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  release-classification:
    name: Release classification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"

      - name: Resolve exact Release Please PR for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: dispatch-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_DISPATCH_HEAD_SHA: ${{ github.sha }}
          RAN_DISPATCH_HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_head='release-please--branches--main--components--ran/booster-github-provider'
          test "$RAN_DISPATCH_HEAD_REF" = "$expected_head"
          pulls="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
          candidate="$(jq -cer \
            --arg bot 'github-actions[bot]' \
            --arg head "$expected_head" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$RAN_DISPATCH_HEAD_SHA" \
            'add
            | [.[] | select(
                .state == "open"
                and .user.login == $bot
                and .base.ref == "main"
                and .base.repo.full_name == $repository
                and .head.ref == $head
                and .head.repo.full_name == $repository
                and .head.sha == $sha
              )]
            | if length == 1 then .[0] else error("Expected exactly one canonical Release Please pull request for dispatch.") end' \
            <<< "$pulls")"
          {
            printf 'base_sha=%s\n' "$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' <<< "$candidate")"
            printf 'head_sha=%s\n' "$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<< "$candidate")"
            printf 'title=%s\n' "$(jq -er '.title | select(type == "string" and length > 0 and (contains("\n") | not))' <<< "$candidate")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node for release classification
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.21.0'
          check-latest: false

      - name: Require release-driving squash title for release-significant changes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          RAN_RELEASE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.dispatch-pr.outputs.base_sha }}
          RAN_RELEASE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || steps.dispatch-pr.outputs.head_sha }}
          RAN_RELEASE_PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || steps.dispatch-pr.outputs.title }}
        run: node scripts/release-classification.mjs

  host-contract:
    name: Booster host contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact package revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: provider
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check out certified Booster host
        # Immutable Core v1.0.0-beta.31 source host: Provider API14 / workflow V3.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          ref: 8a3ed5a8acdb3875f498e2f44bf9eba89fddbbaf
          persist-credentials: false
          path: booster

      - name: Verify exact source and host revisions
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RAN_BOOSTER_HOST_SHA: 8a3ed5a8acdb3875f498e2f44bf9eba89fddbbaf
        run: |
          set -euo pipefail
          test -n "$RAN_EXPECTED_SHA"
          test "$(git -C provider rev-parse HEAD)" = "$RAN_EXPECTED_SHA"
          test "$(git -C booster rev-parse HEAD)" = "$RAN_BOOSTER_HOST_SHA"

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify current host boundary
        env:
          RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/booster
        working-directory: provider
        run: php tests/host-contract.php

  implementation:
    name: Implementation PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    permissions:
      contents: read
    steps:
      - name: Reject privileged pull_request_target callers
        if: ${{ github.event_name == 'pull_request_target' }}
        run: exit 1

      - name: Check out exact package revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: provider
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision and locked manifests
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        working-directory: provider
        run: |
          set -euo pipefail
          test -n "$RAN_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"
          test -f composer.json
          test -f composer.lock

      # Baseline operations mirror quality-php-library-v2 at
      # 788f783d2998994f7aab9691710911ed1bd762c9; this pilot is Provider-only.
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.21.0'
          check-latest: false

      - name: Verify exact Node.js version
        run: test "$(node --version)" = v24.21.0

      - name: Validate Composer configuration
        working-directory: provider
        run: composer validate --strict --no-check-publish --no-check-all

      - name: Install locked Composer dependencies
        working-directory: provider
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run independent baseline before Core exists
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RAN_CI_PHASE_STATE: ${{ runner.temp }}/provider-phase-${{ matrix.php }}
        working-directory: provider
        run: bash scripts/ci-quality-phase.sh baseline

      - name: Check out certified Booster host
        # Immutable Core v1.0.0-beta.31 source host; installed/UI acceptance is separate.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          ref: 8a3ed5a8acdb3875f498e2f44bf9eba89fddbbaf
          persist-credentials: false
          path: booster

      - name: Run certified-host quality aggregate
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RAN_BOOSTER_HOST_SHA: 8a3ed5a8acdb3875f498e2f44bf9eba89fddbbaf
          RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/booster
          RAN_CI_PHASE_STATE: ${{ runner.temp }}/provider-phase-${{ matrix.php }}
        working-directory: provider
        run: bash scripts/ci-quality-phase.sh host

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - release-classification
      - host-contract
      - implementation
    runs-on: ubuntu-24.04
    steps:
      - name: Require all quality lanes
        env:
          CLASSIFICATION_RESULT: ${{ needs.release-classification.result }}
          HOST_CONTRACT_RESULT: ${{ needs.host-contract.result }}
          IMPLEMENTATION_RESULT: ${{ needs.implementation.result }}
        run: |
          printf 'classification=%s\nhost-contract=%s\nimplementation=%s\n' "$CLASSIFICATION_RESULT" "$HOST_CONTRACT_RESULT" "$IMPLEMENTATION_RESULT"
          test "$CLASSIFICATION_RESULT" = success
          test "$HOST_CONTRACT_RESULT" = success
          test "$IMPLEMENTATION_RESULT" = success
